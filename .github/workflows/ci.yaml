name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install dependencies
        working-directory: packages/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller pytest-cov ruff black

      - name: Run lint
        working-directory: packages/cli
        run: |
          ruff check src tests
          black --check src tests

      - name: Run tests
        working-directory: packages/cli
        run: |
          pytest tests -v --cov=src/grobid --cov-report=term-missing

      - name: Build binary
        working-directory: packages/cli
        run: |
          pyinstaller --onefile --name grobid src/grobid/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grobid-linux-amd64
          path: packages/cli/dist/grobid
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: packages/web
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: packages/web
        run: pnpm lint

      - name: Run tests
        working-directory: packages/web
        run: pnpm test:run

      - name: Build
        working-directory: packages/web
        run: pnpm build

  release-latest:
    name: Release (latest)
    needs: [cli]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read release notes from README.md
        id: readme
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat README.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: grobid-linux-amd64
          path: dist

      - name: Delete existing "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create/Update "latest" Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: latest
          name: "Grobid CLI (latest)"
          body: ${{ steps.readme.outputs.body }}
          files: |
            dist/grobid
          draft: false
          prerelease: false
          make_latest: true
