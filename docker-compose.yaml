services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    container_name: grobid
    restart: unless-stopped
    init: true
    ports:
      - "8070:8070"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx4g"
    ulimits:
      core: 0

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
    container_name: grobid-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GROBID_URL=http://grobid:8070
    depends_on:
      - grobid
