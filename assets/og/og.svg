<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="140" r="200" fill="url(#accent)" opacity="0.15"/>
  <circle cx="1180" cy="500" r="160" fill="url(#accent)" opacity="0.12"/>

  <!-- Logo icon, centered at (640, 240), scaled 0.5 -->
  <g transform="translate(420, 80) scale(0.5)" filter="url(#shadow)">
    <path d="M440 0 L717 160 L717 480 L440 640 L163 480 L163 160 Z" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linejoin="round"/>
    <path d="M440 0 L440 640" stroke="url(#accent)" stroke-width="16"/>
    <line x1="163" y1="320" x2="717" y2="320" stroke="url(#accent)" stroke-width="12"/>
  </g>

  <!-- Title, centered -->
  <text x="640" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-2">Grobid CLI</text>

  <!-- Subtitle, centered -->
  <text x="640" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#b0b0c0">Convert PDF articles to Markdown</text>
</svg>