<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- Regular hexagon, pointy-top, centered at (256,256), radius 170 -->
  <!-- Vertices: top, top-right, bottom-right, bottom, bottom-left, top-left -->
  <path d="M256 86 L403 171 L403 341 L256 426 L109 341 L109 171 Z"
        fill="none" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Vertical center divider -->
  <line x1="256" y1="86" x2="256" y2="426" stroke="url(#accent)" stroke-width="6"/>

  <!-- Text, centered at hexagon center -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, sans-serif" font-size="52" font-weight="700"
        fill="#eaeaea">Grobid</text>
</svg>