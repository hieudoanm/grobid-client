[project]
name = "grobid-cli"
version = "0.0.1"
description = "Convert PDF articles to Markdown via GROBID TEI XML (PDF → TEI → MD)"
readme = "README.md"
requires-python = "==3.15.1"
dependencies = [
    "grobid-client-python==0.2.1",
    "lxml==6.1.3",
]
license = {text = "MIT"}
authors = [
    {name = "Hieu Doan", email = "hieu.doan.professional@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Scientific/Engineering",
]
keywords = ["pdf", "markdown", "tei", "grobid", "literature", "conversion", "pdf-to-md"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0", "pyinstaller==6.22.3"]

[project.scripts]
grobid = "grobid.main:main"
grobid-cli = "grobid.main:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]
